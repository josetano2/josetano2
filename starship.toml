# ──────────────────────────────────────────────────────────────────────
#  冒  BOUKEN — your shell as an RPG status window
#
#  ミカ Lv1  HP ━━━━╾ 90%    shop-api   main #5e3966a +1 !1 ?1 ↑1  xp +4 −1     cast 4s  10:43
#  ▶                                                    node 20.20.2  pkg 1.4.0
#
#  ミカ   the hero (edit the name in `format` below)
#  Lv     shell depth: Lv2 inside nvim's terminal, a nested zsh, etc.
#  HP     battery, a draining bar;  while charging
#        where you are            your quest (git branch)
#  xp     lines added / removed since the last commit
#
#  Status effects on the right, only when they happen:
#    dmg 127      the last command failed (exit code)
#    cast 4s      the last command took 2s or more
#    party 2      background jobs tagging along (ctrl-z)
#    heavy 88%    RAM over 85%
#
#  ▶ is the menu cursor: gold normally, red after a failure, ◀ in vim mode.
#  Needs a Nerd Font (GeistMono Nerd Font is already set in WezTerm).
#  Previous theme (Origami): starship.toml.backup-2026-11-25-origami
# ──────────────────────────────────────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'

palette = "bouken"
add_newline = true
continuation_prompt = '[▷ ](fog)'

format = """
[ミカ](bold gold)\
$shlvl\
$battery\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$status\
$cmd_duration\
$jobs\
$memory_usage\
$time\
$line_break\
$character"""

# Far right of the line you type on: your equipment (toolchain).
right_format = """
$python\
$nodejs\
$bun\
$deno\
$rust\
$golang\
$java\
$kotlin\
$c\
$lua\
$dart\
$package\
$docker_context"""

[palettes.bouken]
paper  = "#e8e6f3"
fog    = "#c8c6dc" # labels — light so they read over the wallpaper
mute   = "#9d9bb8" # the clock
gold   = "#ffd166" # the hero
mint   = "#7ee787" # full HP, added lines, staged
lemon  = "#ffe27a"
orange = "#ffa66b"
cherry = "#ff5c7a" # damage
sky    = "#7cc4ff"
lilac  = "#b8a1ff"
pink   = "#ff7eb6"

# ── The cursor ────────────────────────────────────────────────────────
[character]
success_symbol = '[▶](bold gold)'
error_symbol = '[▶](bold cherry)'
vimcmd_symbol = '[◀](bold sky)'
vimcmd_visual_symbol = '[◀](bold lilac)'
vimcmd_replace_symbol = '[◀](bold orange)'
vimcmd_replace_one_symbol = '[◀](bold orange)'

[fill]
symbol = " "

# ── Hero stats ────────────────────────────────────────────────────────
[shlvl]
disabled = false
threshold = 1
format = ' [Lv](fog)[$shlvl](bold paper)'

# Five-cell bar in 10% steps; green, then yellow at 50%, red at 20%.
[battery]
full_symbol = "━━━━━"
unknown_symbol = "━━━━━"
empty_symbol = "─────"
format = '  [HP](fog) [$symbol $percentage]($style)'

[[battery.display]]
threshold = 10
style = "bold cherry"
discharging_symbol = "╾────"
charging_symbol = "╾────"

[[battery.display]]
threshold = 20
style = "bold cherry"
discharging_symbol = "━────"
charging_symbol = "━────"

[[battery.display]]
threshold = 30
style = "fg:lemon"
discharging_symbol = "━╾───"
charging_symbol = "━╾───"

[[battery.display]]
threshold = 40
style = "fg:lemon"
discharging_symbol = "━━───"
charging_symbol = "━━───"

[[battery.display]]
threshold = 50
style = "fg:lemon"
discharging_symbol = "━━╾──"
charging_symbol = "━━╾──"

[[battery.display]]
threshold = 60
style = "fg:mint"
discharging_symbol = "━━━──"
charging_symbol = "━━━──"

[[battery.display]]
threshold = 70
style = "fg:mint"
discharging_symbol = "━━━╾─"
charging_symbol = "━━━╾─"

[[battery.display]]
threshold = 80
style = "fg:mint"
discharging_symbol = "━━━━─"
charging_symbol = "━━━━─"

[[battery.display]]
threshold = 90
style = "fg:mint"
discharging_symbol = "━━━━╾"
charging_symbol = "━━━━╾"

[[battery.display]]
threshold = 100
style = "fg:mint"
discharging_symbol = "━━━━━"
charging_symbol = "━━━━━"

# ── Where you are, what you're doing ──────────────────────────────────
# Only appears over SSH: which world you're in.
[hostname]
ssh_only = true
format = '   [world](fog) [$hostname](bold orange)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "fg:sky"
read_only = " "
read_only_style = "fg:cherry"
repo_root_style = "bold sky"
format = '   [](pink) [$path]($style)[$read_only]($read_only_style)'
repo_root_format = '   [](pink) [$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

[git_branch]
format = '  [](gold) [$branch](lilac)'

[git_commit]
only_detached = false
tag_disabled = false
commit_hash_length = 7
tag_symbol = " "
format = ' [#$hash](fog)[$tag](gold)'

[git_state]
format = ' [$state( $progress_current/$progress_total)](bold orange)'

# + staged  ! modified  ? untracked  × deleted  * stashed  ↑↓ vs remote
[git_status]
format = '([$conflicted$deleted](cherry)[$staged$renamed](mint)[$modified$typechanged](orange)[$untracked](pink)[$stashed](lilac)[$ahead_behind](sky))'
conflicted = ' =${count}'
deleted = ' ×${count}'
staged = ' +${count}'
renamed = ' »${count}'
modified = ' !${count}'
typechanged = ' ~${count}'
untracked = ' ?${count}'
stashed = ' *${count}'
ahead = ' ↑${count}'
behind = ' ↓${count}'
diverged = ' ↑${ahead_count}↓${behind_count}'
up_to_date = ''

[git_metrics]
disabled = false
format = '(  [xp](fog)( [+$added](mint))( [−$deleted](cherry)))'

# ── Status effects ────────────────────────────────────────────────────
[status]
disabled = false
format = '  [dmg](fog) [$status( $signal_name)](bold cherry)'

[cmd_duration]
min_time = 2000
format = '  [cast](fog) [$duration](lemon)'

[jobs]
number_threshold = 1
symbol_threshold = 1
format = '  [party](fog) [$number](lilac)'

[memory_usage]
disabled = false
threshold = 85
format = '  [heavy](fog) [$ram_pct](orange)'

[time]
disabled = false
time_format = "%R"
format = '  [$time](mute) '

# ── Equipment (line 2, right) ─────────────────────────────────────────
[python]
version_format = "${raw}"
format = '  [py](fog) [$version](lemon)( [\($virtualenv\)](fog))'

[nodejs]
version_format = "${raw}"
format = '  [node](fog) [$version](mint)'

[bun]
version_format = "${raw}"
format = '  [bun](fog) [$version](pink)'

[deno]
version_format = "${raw}"
format = '  [deno](fog) [$version](mint)'

[rust]
version_format = "${raw}"
format = '  [rust](fog) [$version](orange)'

[golang]
version_format = "${raw}"
format = '  [go](fog) [$version](sky)'

[java]
version_format = "${raw}"
format = '  [java](fog) [$version](cherry)'

[kotlin]
version_format = "${raw}"
format = '  [kt](fog) [$version](lilac)'

[c]
version_format = "${raw}"
format = '  [c](fog) [$version](sky)'

[lua]
version_format = "${raw}"
format = '  [lua](fog) [$version](lilac)'

[dart]
version_format = "${raw}"
format = '  [dart](fog) [$version](sky)'

[package]
version_format = "${raw}"
format = '  [pkg](fog) [$version](pink)'

[docker_context]
format = '  [docker](fog) [$context](sky)'
